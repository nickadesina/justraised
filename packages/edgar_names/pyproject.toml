[project]
name = "edgar-names"
version = "0.1.0"
description = "Normalize and match SEC issuer legal names to brand names (shared by Just Raised and PrivateMarks)"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgar_names"]
